<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>UC Timetable Filter</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/copy-url.js" defer></script>
</head>
<body>
  <main class="shell">
    <div class="brand">UC Timetable Filter</div>
    <h1>Keep unwanted events out of your calendar.</h1>

    <div class="card">
      <form id="analyze-form" action="/analyze" method="post"
            hx-post="/analyze" hx-target="#filter-panel" hx-swap="innerHTML"
            hx-indicator="#analyze-loading" hx-disabled-elt="find button">
        <section class="step" aria-labelledby="step1">
          <div class="step-content">
            <label id="step1" class="title" for="feed-url">Enter a MyUC timetable URL or existing filtered URL</label>
            <input id="feed-url" name="feed_url" type="url" placeholder="https://timetable.canterbury.ac.nz/...." required autocomplete="url" value="{{.SourceURL}}">
            <div class="submit-row analyze-row">
              <button type="submit">
                <span id="analyze-loading" class="htmx-indicator analyze-loading" role="status" aria-live="polite" aria-atomic="true">
                  <span class="loading-spinner" aria-hidden="true"></span>
                  <span>Searching...</span>
                </span>
                <span class="analyze-idle">Find my event types</span>
              </button>
            </div>
          </div>
        </section>
      </form>

      <div id="filter-panel" aria-live="polite">
        {{if .Analyzed}}
          {{template "event-filters" .}}
        {{else if .Error}}
          {{template "form-error" .}}
        {{end}}
      </div>
    </div>
  </main>
</body>
</html>
