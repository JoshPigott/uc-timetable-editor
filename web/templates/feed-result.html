{{define "feed-result"}}
<section class="result" aria-live="polite">
  <h2>Your new calendar URL is ready</h2>
  <p>Use this address in your calendar app to subscribe to your UC timetable. Keep it private.</p>
  <label class="visually-hidden" for="output-url">Calendar URL</label>
  <input id="output-url" class="feed-url" type="url" readonly value="{{.FeedURL}}">
</section>
{{end}}
