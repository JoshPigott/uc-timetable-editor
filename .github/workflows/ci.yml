name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  pr-conventions:
    name: Branch and commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch and commit conventions
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const title = context.payload.pull_request.title;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const types = 'feat|fix|ci|docs|chore|refactor|test|perf|build';
            const branchRe = new RegExp(`^(${types})/`);
            const subjectRe = new RegExp(`^(${types})(\\(.+\\))?: .{1,72}$`);

            const expected = `Expected one of: ${types}`;
            const problems = [];
            if (!branchRe.test(branch)) {
              problems.push(`branch "${branch}" must start with "<type>/". ${expected}`);
            }
            if (!subjectRe.test(title)) {
              problems.push(`PR title "${title}" must be "<type>(optional scope): description". ${expected}`);
            }
            for (const { commit } of commits) {
              const subject = commit.message.split('\n')[0];
              if (!subjectRe.test(subject)) {
                problems.push(`commit "${subject}" must be "<type>(optional scope): description". ${expected}`);
              }
            }

            if (problems.length) {
              core.setFailed(`Convention violations:\n- ${problems.join('\n- ')}`);
            }
